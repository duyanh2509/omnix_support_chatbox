version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: omnisupport-postgres
    environment:
      POSTGRES_USER: omnisupport
      POSTGRES_PASSWORD: omnisupport
      POSTGRES_DB: omnisupport
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnisupport"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omnisupport-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: omnisupport-backend
    environment:
      DATABASE_URL: postgresql://omnisupport:omnisupport@postgres:5432/omnisupport
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-key-change-in-production
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/node_modules

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: omnisupport-dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - backend
    volumes:
      - ./apps/dashboard:/app/apps/dashboard
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
